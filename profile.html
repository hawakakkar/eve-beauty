<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eve Beauty | My Profile</title>

    <link rel="stylesheet" href="css/profile.css" />
  </head>

  <body>
    <main class="profile-page">
      <section class="profile-card">
        <a href="index.html" class="back-home"> ← Back to Home </a>

        <div class="profile-image-area">
          <div class="profile-image-wrapper">
            <img id="profilePageImage" src="" alt="Profile" />
          </div>

          <label for="profileImageInput" class="change-photo">
            Change Photo
          </label>

          <input type="file" id="profileImageInput" accept="image/*" hidden />
        </div>

        <h1 id="profilePageName">User</h1>

        <p id="profilePageEmail">email@example.com</p>

        <form id="profileForm">
          <div class="profile-field">
            <label for="profilePageNameInput"> Full Name </label>

            <input type="text" id="profilePageNameInput" required />
          </div>

          <div class="profile-field">
            <label for="profilePageEmailInput"> Email </label>

            <input type="email" id="profilePageEmailInput" required />
          </div>

          <p id="profileMessage"></p>

          <button type="submit" class="save-profile-btn">Save Changes</button>
        </form>
      </section>
    </main>
    <script src="js/components.js"></script>
    <script src="js/profile-page.js"></script>
  </body>
</html>
