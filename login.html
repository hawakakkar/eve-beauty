<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eve Beauty | Sign In</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/login-signup.css" />
  </head>

  <body>
    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="auth-page">
      <!-- Theme Toggle -->
      <div class="theme-toggle">
        <button
          type="button"
          class="theme-btn active"
          id="lightModeBtn"
          aria-label="Light mode"
        >
          <span class="icon">
            <i data-lucide="sun"></i>
          </span>
          <span>Light</span>
        </button>

        <button
          type="button"
          class="theme-btn"
          id="darkModeBtn"
          aria-label="Dark mode"
        >
          <span class="icon">
            <i data-lucide="moon"></i>
          </span>
          <span>Dark</span>
        </button>
      </div>

      <!-- Logo -->
      <a href="index.html" class="auth-logo">
        <img src="assets/images/logo.png" alt="Eve Beauty Logo" />
      </a>

      <!-- Main Content -->
      <section class="auth-content">
        <!-- =================================================
                 LOGIN FORM
            ================================================== -->

        <div class="auth-form login-form" id="loginForm">
          <span class="eyebrow"> WELCOME BACK</span>

          <h1>Login To Your Account</h1>

          <div class="heading-line"></div>

          <p class="intro">
            Access your orders, track your beauty journey and get exclusive
            offers.
          </p>

          <!-- Login Form -->
          <form id="signInForm">
            <!-- Email -->
            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                  <path d="m3 7 9 6 9-6"></path>
                </svg>
              </span>

              <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
                autocomplete="email"
                required
              />
            </div>

            <!-- Password -->
            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>

                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>

              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="loginPasswordToggle"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24">
                  <path
                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <!-- Remember / Forgot -->
            <div class="form-options">
              <label class="remember">
                <input type="checkbox" id="rememberMe" checked />

                <span class="custom-check"></span>

                <span> Remember me </span>
              </label>

              <button type="button" class="forgot-btn" id="forgotPassword">
                Forgot password?
              </button>
            </div>

            <!-- Error / Success -->
            <p class="form-message" id="loginMessage"></p>

            <!-- Submit -->
            <button type="submit" class="main-btn">
              <span> Login</span>

              <span class="arrow">
                <i data-lucide="arrow-right"></i>
              </span>
            </button>
          </form>

          <!-- Switch to Sign Up -->
          <div class="switch-account">
            <span></span>

            <p>
              Don't have an account?

              <a href="signup.html"> Sign up </a>
            </p>

            <span></span>
          </div>

          <!-- Social -->
          <div class="social-area">
            <p>OR CONTINUE WITH</p>

            <div class="social-buttons">
              <button type="button" aria-label="Globe">
                <i data-lucide="globe"></i>
              </button>

              <button type="button" aria-label="Mail">
                <i data-lucide="mail"></i>
              </button>

              <button type="button" aria-label="Phone">
                <i data-lucide="phone"></i>
              </button>
            </div>
          </div>
        </div>
      </section>
      <a href="index.html" class="back-home">
        <i data-lucide="arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript -->
    <script src="js/login.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
