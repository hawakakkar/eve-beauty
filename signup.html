<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eve Beauty | Sign Up</title>

    <link rel="stylesheet" href="css/login-signup.css" />
  </head>

  <body>
    <main class="auth-page">
      <!-- Theme Toggle -->
      <div class="theme-toggle">
        <button
          type="button"
          class="theme-btn active"
          id="lightModeBtn"
          aria-label="Light mode"
        >
          <span class="icon">☼</span>
          <span>Light</span>
        </button>

        <button
          type="button"
          class="theme-btn"
          id="darkModeBtn"
          aria-label="Dark mode"
        >
          <span class="icon">☾</span>
          <span>Dark</span>
        </button>
      </div>

      <!-- Sign Up Card -->
      <section class="auth-content">
        <div class="auth-form signup-form" id="signupForm">
          <span class="eyebrow"> CREATE ACCOUNT </span>

          <h1>
            Create Your<br />
            Beauty Account
          </h1>

          <div class="heading-line"></div>

          <p class="intro">
            Join Eve Beauty and enjoy a more personal beauty experience.
          </p>

          <form id="createAccountForm">
            <!-- Full Name -->

            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"></path>
                </svg>
              </span>

              <input
                type="text"
                id="signupName"
                placeholder="Full name"
                autocomplete="name"
                required
              />
            </div>

            <!-- Email -->

            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3 7 9 6 9-6"></path>
                </svg>
              </span>

              <input
                type="email"
                id="signupEmail"
                placeholder="Email address"
                autocomplete="email"
                required
              />
            </div>

            <!-- Password -->

            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>

              <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="signupPasswordToggle"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24">
                  <path
                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <p class="form-message" id="signupMessage"></p>

            <button type="submit" class="main-btn">
              <span>Create Account</span>
              <span class="arrow">→</span>
            </button>
          </form>

          <!-- Go To Login Page -->

          <div class="switch-account">
            <span></span>

            <p>
              Already have an account?

              <a href="login.html"> Login </a>
            </p>

            <span></span>
          </div>
        </div>
      </section>
    </main>

    <script src="js/signup.js"></script>
  </body>
</html>
