<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wishlist | EVE Beauty</title>

    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/wishlist.css" />
  </head>

  <body>
    <header id="navbar-container" class="navbar-container"></header>

    <main class="wishlist-page">
      <section class="wishlist-hero">
        <div class="wishlist-container">
          <p class="eyebrow">EVE BEAUTY</p>

          <h1>My Wishlist</h1>

          <p>
            Save your favorite beauty products and come back to them anytime.
          </p>
        </div>
      </section>

      <section class="wishlist-section">
        <div class="wishlist-container">
          <div class="wishlist-heading">
            <div>
              <h2>Saved Products</h2>
              <p id="wishlistCount">0 products</p>
            </div>

            <button id="clearWishlist" class="secondary-button" type="button">
              Clear wishlist
            </button>
          </div>

          <div id="wishlistGrid" class="wishlist-grid"></div>
        </div>
      </section>
    </main>

    <footer id="footer-container" class="footer-container"></footer>

    <script src="js/components.js"></script>
    <script src="js/wishlist.js"></script>

    <script>
      if (window.lucide) {
        lucide.createIcons();
      }
    </script>
  </body>
</html>
